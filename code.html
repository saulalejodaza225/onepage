<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arquitectura digital inconfundible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Michroma&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Paleta de colores */
      --color-bg: #05070D;
      --color-surface-tunnel-center: rgba(139, 92, 246, 0.16);
      --color-surface-tunnel-outer: #05070D;
      --color-text-main: #F4F6F9;
      --color-text-muted: #8E9BAE;
      --color-text-btn: #05070D;
      --color-accent-cyan: #5CE1FF;
      --color-accent-violet: #8B5CF6;
      --color-border-subtle: rgba(92, 225, 255, 0.15);
      
      /* Tipografía */
      --font-title: 'Michroma', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      
      /* Dimensiones y espaciado */
      --margin-inline: 16px;
      --radius-btn: 14px;
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
    }

    /* Contenedor principal de pantalla fija sin scroll (100dvh) */
    .screen-container {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-top: var(--safe-area-top);
      padding-bottom: var(--safe-area-bottom);
      background-color: var(--color-bg);
    }

    /* 1. Zona de escena 3D (~58% superior) */
    #scene-3d {
      width: 100%;
      height: 58dvh;
      min-height: 240px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, var(--color-surface-tunnel-center) 0%, rgba(20, 16, 45, 0.45) 45%, var(--color-surface-tunnel-outer) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
    }

    #scene-3d { position: fixed; inset: 0; width: 100%; height: 100dvh; min-height: 0; z-index: 0; overflow: hidden; touch-action: none; border-bottom: none; }
    .screen-container { max-width: none; background: transparent; position: relative; z-index: 1; pointer-events: none; }
    main.screen-container > .content-container { justify-content: flex-end; max-width: 430px; width: 100%; margin: 0 auto; background: none; }
    .screen-container::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 45dvh; background: linear-gradient(to top, rgba(5,7,13,0.88) 0%, rgba(5,7,13,0.5) 55%, rgba(5,7,13,0) 100%); z-index: -1; pointer-events: none; }
    #nogl[hidden] { display: none; }
    #gyro-note { position: absolute; left: 16px; right: 16px; top: 16px; max-width: 440px; margin: 0 auto; padding: 12px 14px; border-radius: 14px; background: rgba(10,8,24,0.82); border: 1px solid var(--color-border-subtle); color: var(--color-text-main); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; z-index: 3; }
    #gyro-note[hidden] { display: none; }
    #moments-hud { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; transform: none; z-index: 3; display: block; max-width: calc(100% - 156px); padding: 7px 14px; border-radius: 16px; background: rgba(5,7,13,0.55); border: 1px solid var(--color-border-subtle); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; line-height: 1.4; color: var(--color-text-muted); white-space: normal; text-align: center; width: max-content; pointer-events: none; }
    #moments-hud .dot { display: inline-block; vertical-align: middle; margin: -2px 6px 0 0; width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent-cyan); box-shadow: 0 0 8px var(--color-accent-cyan); animation: momentsPulse 1.8s ease-in-out infinite; }
    @keyframes momentsPulse { 50% { opacity: 0.3; } }
    #moment-toast { position: absolute; top: calc(52px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; margin: 0 auto; max-width: 340px; z-index: 3; padding: 8px 14px; border-radius: 14px; background: rgba(10,8,24,0.8); border: 1px solid rgba(92,225,255,0.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); text-align: center; pointer-events: none; opacity: 0; transform: translateY(-8px); transition: opacity 0.35s ease, transform 0.35s ease; }
    #moment-toast.show { opacity: 1; transform: none; }
    #moment-toast[hidden] { display: none; }
    #btn-estabilizar { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 4; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--color-border-subtle); background: rgba(5,7,13,0.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--color-text-main); font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; cursor: pointer; pointer-events: auto; transition: border-color 0.2s, background 0.2s; touch-action: manipulation; }
    #btn-estabilizar:hover { border-color: var(--color-accent-cyan); background: rgba(92,225,255,0.08); }
    #btn-estabilizar:active { transform: scale(0.97); }
    #btn-estabilizar:focus-visible { outline: 2px solid var(--color-accent-cyan); outline-offset: 2px; }
    #btn-estabilizar svg { width: 16px; height: 16px; flex: none; }
    #moment-toast strong { display: block; font-family: var(--font-title); font-weight: 400; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-cyan); margin-bottom: 2px; }
    #moment-toast span { font-family: var(--font-mono); font-size: 11px; line-height: 1.4; color: var(--color-text-main); }
    @media (prefers-reduced-motion: reduce) { #moments-hud .dot { animation: none; } }
    #btn-gyro, #btn-pause, #btn-hud, #btn-cine, #speed, #speed-out { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
    #loader.done { visibility: hidden; }
    .content-container .button-wrapper { pointer-events: auto; }
    .text-block { text-shadow: 0 2px 18px rgba(0,0,0,0.7); }
    #scene-3d canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; touch-action: none; outline: none; }
    #scene-3d .hud-stub { display: none; }
    #loader { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 24px; text-align: center; pointer-events: none; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-text-muted); transition: opacity 0.7s ease; z-index: 2; }
    #loader.done { opacity: 0; }
    #nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 24px; text-align: center; font-size: 13px; line-height: 1.5; z-index: 2; }

    /* Etiqueta identificadora monoespaciada para la escena */
    .scene-placeholder-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(92, 225, 255, 0.7);
      background: rgba(13, 20, 36, 0.6);
      border: 1px solid var(--color-border-subtle);
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .scene-placeholder-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent-cyan);
      box-shadow: 0 0 8px var(--color-accent-cyan);
    }

    /* Área inferior: Contenido editorial y CTA */
    .content-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-left: var(--margin-inline);
      padding-right: var(--margin-inline);
      padding-top: clamp(14px, 2.5dvh, 24px);
      padding-bottom: clamp(16px, 3dvh, 28px);
    }

    /* 2. Bloque de texto */
    .text-block {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    #title {
      font-family: var(--font-title);
      font-size: clamp(23px, 6.4vw, 29px);
      line-height: 1.15;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-main);
      margin-bottom: 10px;
      word-break: break-word;
    }

    #subtitle {
      font-family: var(--font-mono);
      font-size: 14.5px;
      line-height: 1.45;
      font-weight: 400;
      color: var(--color-text-muted);
      max-width: 95%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 3. Botón principal interactivo */
    .button-wrapper {
      width: 100%;
      padding-top: 24px;
    }

    #cta-button {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: var(--radius-btn);
      background: linear-gradient(135deg, var(--color-accent-cyan) 0%, #3B82F6 100%);
      color: var(--color-text-btn);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(92, 225, 255, 0.22);
      transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1),
                  filter 0.15s ease,
                  box-shadow 0.15s ease;
      touch-action: manipulation;
    }

    /* Estados interactivos */
    #cta-button:active {
      transform: scale(0.98);
      filter: brightness(0.88);
      box-shadow: 0 2px 10px rgba(92, 225, 255, 0.15);
    }

    #cta-button:disabled,
    #cta-button[aria-disabled="true"] {
      opacity: 0.4;
      pointer-events: none;
      box-shadow: none;
      cursor: not-allowed;
    }
    /* Cuestionario: reemplaza el título y el botón cuando se presiona "Conoce tu negocio". */
    .quiz { pointer-events: auto; display: flex; flex-direction: column; gap: 12px; max-height: min(68dvh, 560px); overflow-y: auto; overscroll-behavior: contain; padding: 18px 16px 16px; border-radius: 18px; background: rgba(5,7,13,0.74); border: 1px solid var(--color-border-subtle); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); animation: quizIn 0.35s ease both; }
    .quiz[hidden], .text-block[hidden], .button-wrapper[hidden] { display: none; }
    @keyframes quizIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .quiz-eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-cyan); }
    .quiz-back { min-width: 44px; min-height: 44px; margin: -10px -8px -10px 0; border: none; background: none; color: var(--color-text-muted); font-family: var(--font-mono); font-size: 12px; cursor: pointer; }
    .quiz-back:hover { color: var(--color-text-main); }
    .quiz-bar { height: 2px; border-radius: 2px; background: rgba(92,225,255,0.15); overflow: hidden; }
    .quiz-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--color-accent-cyan), #3B82F6); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .quiz-count { font-size: 11px; letter-spacing: 0.08em; color: var(--color-text-muted); }
    .quiz-q { font-family: var(--font-title); font-weight: 400; font-size: clamp(16px, 4.6vw, 20px); line-height: 1.35; letter-spacing: 0.02em; }
    .quiz-q[hidden] { display: none; }
    .quiz-q:focus, .quiz-r-name:focus { outline: none; }
    .quiz-options { display: grid; gap: 8px; }
    .quiz-options[hidden] { display: none; }
    .quiz-options button { min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(92,225,255,0.28); background: rgba(13,20,36,0.6); color: var(--color-text-main); font-family: var(--font-mono); font-size: 13.5px; line-height: 1.35; text-align: left; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.12s; touch-action: manipulation; }
    .quiz-options button:hover { border-color: var(--color-accent-cyan); background: rgba(92,225,255,0.08); }
    .quiz-options button:active { transform: scale(0.98); }
    .quiz-options button:focus-visible, .quiz-back:focus-visible, .quiz-actions a:focus-visible, .quiz-actions button:focus-visible { outline: 2px solid var(--color-accent-cyan); outline-offset: 2px; }
    .quiz-result { display: flex; flex-direction: column; gap: 6px; }
    .quiz-result[hidden] { display: none; }
    .quiz-r-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-cyan); }
    .quiz-r-name { font-family: var(--font-title); font-weight: 400; font-size: clamp(20px, 6vw, 26px); line-height: 1.2; letter-spacing: 0.04em; text-transform: uppercase; }
    .quiz-r-price { font-size: 24px; font-weight: 600; color: var(--color-accent-cyan); }
    .quiz-r-time { font-size: 12px; color: var(--color-text-muted); }
    .quiz-r-text { font-size: 13.5px; line-height: 1.5; color: var(--color-text-main); }
    .quiz-actions { display: grid; gap: 8px; margin-top: 8px; }
    .quiz-actions a, .quiz-actions button { min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-btn); font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; cursor: pointer; }
    .quiz-demo { background: linear-gradient(135deg, var(--color-accent-cyan) 0%, #3B82F6 100%); color: var(--color-text-btn); border: none; box-shadow: 0 4px 20px rgba(92,225,255,0.22); }
    .quiz-restart { background: rgba(13,20,36,0.6); color: var(--color-text-main); border: 1px solid rgba(92,225,255,0.28); }
    @media (prefers-reduced-motion: reduce) { .quiz { animation: none; } }
  </style>
</head>
<body>


    <section id="scene-3d" aria-label="Zona reservada para escena 3D interactiva">
      <div id="loader">Tejiendo el traje y curvando el espacio…</div>
      <div id="nogl" hidden><p>Tu navegador no pudo iniciar WebGL.</p></div>
      <!-- Elementos que la escena actualiza internamente (telemetría); ocultos en la versión móvil -->
      <div class="hud-stub" id="hud" aria-hidden="true">
        <span id="t-mode"></span><span id="t-depth"></span><span id="t-vel"></span><span id="t-gamma"></span><span id="t-hr"></span>
        <span id="t-ship"></span><span id="t-ext"></span><span id="t-o2"></span><span id="t-resp"></span>
        <div id="perf-row" hidden><span id="t-perf"></span></div>
        <output id="speed-out"></output><input id="speed" type="range" min="0.2" max="2.5" step="0.05" value="1">
        <button id="btn-pause" type="button"></button><button id="btn-gyro" type="button" hidden></button><button id="btn-cine" type="button"></button><button id="btn-hud" type="button"></button>
      </div>
      <button id="btn-show" type="button" hidden></button>
      <p id="gyro-note" role="status" hidden></p>
      <div id="moments-hud"><span class="dot" aria-hidden="true"></span>Hay momentos ocultos · <span id="moments-hint">gira tu celular</span></div>
      <div id="moment-toast" role="status" hidden><strong></strong><span></span></div>
      <button id="btn-estabilizar" type="button" aria-label="Estabilizar la cámara y recuperar el control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Estabilizar
      </button>
    </section>

  <main class="screen-container">

    <!-- Área de contenido inferior -->
    <section class="content-container">
      <!-- 2. Bloque de texto -->
      <div class="text-block">
        <h1 id="title">Arquitectura digital inconfundible</h1>
        <p id="subtitle">explora tu página ideal</p>
      </div>

      <!-- 3. Botón de acción principal -->
      <div class="button-wrapper">
        <button id="cta-button" type="button" aria-label="Conoce tu negocio">
          Conoce tu negocio
        </button>
      </div>

      <!-- 4. Cuestionario: aparece al presionar "Conoce tu negocio" -->
      <div class="quiz" id="quiz" role="region" aria-labelledby="quiz-q" hidden>
        <div class="quiz-top">
          <span class="quiz-eyebrow">Tu página ideal · 5 preguntas</span>
          <button type="button" class="quiz-back" aria-label="Volver al inicio">← Volver</button>
        </div>
        <div class="quiz-bar" aria-hidden="true"><span></span></div>
        <p class="quiz-count" aria-live="polite"></p>
        <h2 class="quiz-q" id="quiz-q" tabindex="-1"></h2>
        <div class="quiz-options"></div>
        <div class="quiz-result" aria-live="polite" hidden>
          <p class="quiz-r-label">Te recomendamos</p>
          <h2 class="quiz-r-name" tabindex="-1"></h2>
          <p class="quiz-r-price"></p>
          <p class="quiz-r-time"></p>
          <p class="quiz-r-text"></p>
          <div class="quiz-actions">
            <a class="quiz-demo" href="#" target="_blank" rel="noopener">Ver demo</a>
            <button type="button" class="quiz-restart">Volver a empezar</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="escena-3d.js"></script>
  <script>
    // Cuestionario: 5 preguntas; cada respuesta suma puntos a los cuatro modelos
    // (L = Landing, P = PYME, E = Empresarial, T = Tienda). Gana el de más puntos;
    // en empate, el primero de la lista. Mismas preguntas, precios y demos que el sitio.
    (function () {
      var PREGUNTAS = [
        { q: '¿Qué tiene hoy tu negocio en línea?', o: [
          { t: 'Nada todavía', p: { L: 2 } },
          { t: 'Redes sociales o una página básica', p: { P: 2 } },
          { t: 'Un catálogo amplio de productos o servicios', p: { E: 2 } },
          { t: 'Quiero vender y cobrar en línea', p: { T: 2 } }
        ] },
        { q: '¿Quién actualizará el contenido?', o: [
          { t: 'Yo, sin depender de nadie', p: { P: 2, E: 1 } },
          { t: 'Un equipo con varias personas', p: { E: 2 } },
          { t: 'Casi nunca cambiará, quiero una presencia fija', p: { L: 2 } },
          { t: 'Inventario y pedidos al día', p: { T: 2 } }
        ] },
        { q: '¿Cuántos productos o servicios quieres mostrar?', o: [
          { t: 'Uno o pocos (hasta 4 bloques)', p: { L: 2 } },
          { t: 'Entre 5 y 20', p: { P: 2 } },
          { t: 'Más de 20', p: { E: 1, T: 2 } }
        ] },
        { q: '¿Necesitas cobrar en línea con pasarela de pago?', o: [
          { t: 'No', p: { L: 1, P: 1, E: 1 } },
          { t: 'Sí, con Wompi, PayU o PSE', p: { T: 3 } },
          { t: 'Por ahora no, pero lo planeo', p: { P: 1, E: 1 } }
        ] },
        { q: '¿Para cuándo necesitas tu página lista?', o: [
          { t: 'Lo antes posible (menos de una semana)', p: { L: 2 } },
          { t: 'En un par de semanas', p: { P: 1, E: 1 } },
          { t: 'Tengo tiempo para un proyecto completo', p: { E: 2, T: 1 } }
        ] }
      ];
      var MODELOS = {
        L: { nombre: 'Landing Page', precio: '$675.000', entrega: 'Entrega: 5 días', demo: 'https://landing-page-demo-ruby.vercel.app/',
             texto: 'Ideal para un negocio que hoy no tiene nada en línea y quiere empezar a recibir clientes.' },
        P: { nombre: 'Página PYME', precio: '$1.080.000', entrega: 'Entrega: 8 días', demo: 'https://modelo-pyme-demo.vercel.app/',
             texto: 'Ideal para un negocio que quiere poder actualizar su propia web sin depender de terceros.' },
        E: { nombre: 'Página Empresarial', precio: '$1.620.000', entrega: 'Entrega: 12 días', demo: 'https://dise-o-empresarial-demo.vercel.app/',
             texto: 'Ideal para un negocio que necesita mostrar un catálogo amplio de productos o servicios con prestancia.' },
        T: { nombre: 'Tienda Online', precio: '$2.160.000', entrega: 'Entrega: 15 días', demo: 'https://e-store-demo1.vercel.app/',
             texto: 'Ideal para un negocio que quiere vender y cobrar en línea directamente con pasarela de pagos.' }
      };
      var ORDEN = ['L', 'P', 'E', 'T'];

      var cta = document.getElementById('cta-button');
      var textos = document.querySelector('.text-block'), botonera = document.querySelector('.button-wrapper');
      var quiz = document.getElementById('quiz');
      var barra = quiz.querySelector('.quiz-bar span'), contador = quiz.querySelector('.quiz-count'), pregunta = quiz.querySelector('.quiz-q');
      var opciones = quiz.querySelector('.quiz-options'), resultado = quiz.querySelector('.quiz-result');
      var paso = 0, puntos = { L: 0, P: 0, E: 0, T: 0 };

      function mostrarPaso() {
        var p = PREGUNTAS[paso];
        contador.textContent = 'Pregunta ' + (paso + 1) + ' de ' + PREGUNTAS.length;
        barra.style.width = (paso / PREGUNTAS.length * 100) + '%';
        pregunta.textContent = p.q; pregunta.hidden = false;
        opciones.innerHTML = '';
        p.o.forEach(function (op) {
          var b = document.createElement('button');
          b.type = 'button'; b.textContent = op.t;
          b.addEventListener('click', function () { responder(op.p); });
          opciones.appendChild(b);
        });
        opciones.hidden = false; resultado.hidden = true;
        pregunta.focus({ preventScroll: true });
      }
      function responder(suma) {
        Object.keys(suma).forEach(function (k) { puntos[k] += suma[k]; });
        paso++;
        if (paso < PREGUNTAS.length) mostrarPaso(); else mostrarResultado();
      }
      function mostrarResultado() {
        var mejor = ORDEN[0];
        ORDEN.forEach(function (k) { if (puntos[k] > puntos[mejor]) mejor = k; });
        var m = MODELOS[mejor];
        contador.textContent = 'Tu resultado';
        barra.style.width = '100%';
        pregunta.hidden = true; opciones.hidden = true; opciones.innerHTML = '';
        quiz.querySelector('.quiz-r-name').textContent = m.nombre;
        quiz.querySelector('.quiz-r-price').textContent = m.precio;
        quiz.querySelector('.quiz-r-time').textContent = m.entrega;
        quiz.querySelector('.quiz-r-text').textContent = m.texto;
        var demo = quiz.querySelector('.quiz-demo');
        demo.href = m.demo; demo.setAttribute('aria-label', 'Ver demo de ' + m.nombre + ' (se abre en una pestaña nueva)');
        resultado.hidden = false;
        quiz.querySelector('.quiz-r-name').focus({ preventScroll: true });
      }
      function empezar() { paso = 0; puntos = { L: 0, P: 0, E: 0, T: 0 }; quiz.scrollTop = 0; mostrarPaso(); }

      cta.addEventListener('click', function () {
        textos.hidden = true; botonera.hidden = true; quiz.hidden = false;
        empezar();
      });
      quiz.querySelector('.quiz-restart').addEventListener('click', empezar);
      quiz.querySelector('.quiz-back').addEventListener('click', function () {
        quiz.hidden = true; textos.hidden = false; botonera.hidden = false;
        cta.focus({ preventScroll: true });
      });
    })();
  </script>
</body>
</html>
